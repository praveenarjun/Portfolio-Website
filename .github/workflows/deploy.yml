name: Build and Deploy
env:
  CI: false
  GITHUB_USERNAME: ${{ github.repository_owner }}
  REACT_APP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This is automatically set by Github Actions
  USE_GITHUB_DATA: "true"
  MEDIUM_USERNAME: "" # Add your Medium username here if you want to fetch blogs
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 12 * * 1" # see https://docs.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build 🔧 # Build the Project
        run: |
          npm install
          npm run build
        continue-on-error: false
      
      - name: Copy 404.html for SPA routing 🔄
        run: |
          cp public/404.html build/404.html || echo "404.html already exists or not found"

      - name: Update 404.html redirection logic
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$REPO_NAME" == "$OWNER.github.io" ]]; then
            SEGMENTS=0
          else
            SEGMENTS=1
          fi
          echo "Setting pathSegmentsToKeep to $SEGMENTS for repo $REPO_NAME"
          sed -i "s/var pathSegmentsToKeep = 1;/var pathSegmentsToKeep = $SEGMENTS;/g" build/404.html || true
      
      - name: Verify Build Output 🔍
        run: |
          echo "Build contents:"
          ls -la build/ | head -20
          echo "Checking for index.html:"
          test -f build/index.html && echo "✓ index.html exists" || echo "✗ index.html missing"
          echo "Checking for 404.html:"
          test -f build/404.html && echo "✓ 404.html exists" || echo "✗ 404.html missing"
      
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build
          CLEAN: true
          SINGLE_COMMIT: true
